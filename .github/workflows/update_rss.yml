name: Generate X RSS Feed

on:
  schedule:
    # Runs every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants permission to commit updated RSS file

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ntscraper feedgen

      - name: Run RSS Generator
        run: python generate_rss.py

      - name: Commit & Push Updated RSS File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add twitter_feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feed" && git push)
